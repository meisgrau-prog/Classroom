    <main class="hp-main">

        <p class="teacher" data-teacher>Rabbi Eisgrau</p>
        <p class="grade-line" data-grade-wrap hidden><span data-grade></span></p>
        <p class="hp-blurb">Classwork, homework, news and programs for our class families — all in one place. Please sign in to continue.</p>
      </section>
      <form class="hp-card" id="signin-form" autocomplete="on">
        <h2>Sign in</h2>
        <div class="hp-tabs" role="tablist" aria-label="I am a">
          <button type="button" role="tab" class="hp-tab" data-role="parent" aria-selected="true">Parent</button>
          <button type="button" role="tab" class="hp-tab" data-role="teacher" aria-selected="false">Teacher</button>
        </div>
        <p class="hp-sub" id="signin-sub">Enter the class password.</p>
        <input type="email" id="si-email" class="hidden" placeholder="Email" autocomplete="username" aria-label="Email">
        <input type="password" id="si-pass" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
        <label class="hp-remember"><input type="checkbox" id="si-remember"> Keep me signed in on this device</label>
        <button class="hp-btn" type="submit" id="si-btn">Sign in</button>
        <p class="hp-msg" id="si-msg"></p>
        <div class="hp-links hidden" id="si-parent-links">
          <a href="parents.html#forgot">Forgot password?</a>
          <a href="parents.html#signup">Create a parent profile</a>
        </div>
        <a class="hp-open hidden" id="si-open" href="parents.html">Go to the Parent Portal →</a>
        <button type="button" class="hp-role-link hidden" id="si-role-link"></button>
      </form>
    </main>
    <footer class="hp-foot">© <span data-teacher>Rabbi Eisgrau</span></footer>
  </div>
  <script>
    (async function () {
      const $ = id => document.getElementById(id);
      const form = $("si-form") || $("signin-form"), msg = $("si-msg"), btn = $("si-btn");
      const store = (key, val, remember) => { try { (remember ? localStorage : sessionStorage).setItem(key, val); } catch {} };
      let c = null, teacherLock = null;
      try { c = await loadContent(); } catch {}
      try { teacherLock = await fetchTeacherLock(); } catch {}
      const pa = c && c.settings.parentAccounts, lock = c && c.settings.siteLock;
      const profiles = !!(pa && pa.on && pa.apiKey);
      const open = c && !profiles && !(lock && lock.on && lock.hash);
      let role = "parent";
      function setRole(r) {
        role = r;
        document.querySelectorAll(".hp-tab").forEach(t => t.setAttribute("aria-selected", t.dataset.role === r ? "true" : "false"));
        const parent = r === "parent";
        $("si-email").classList.toggle("hidden", !(parent && profiles));
        $("si-parent-links").classList.toggle("hidden", !(parent && profiles));
        $("si-open").classList.toggle("hidden", !(parent && open));
        $("si-pass").classList.toggle("hidden", parent && open);
        $("si-btn").classList.toggle("hidden", parent && open);
        document.querySelector(".hp-remember").classList.toggle("hidden", parent && open);
        $("signin-sub").textContent = !parent ? "Enter your teacher password."
          : open ? "The Parent Portal is open — no password needed."
          : profiles ? "Sign in with your email and password." : "Enter the class password.";
        $("si-msg").textContent = "";
        // With parent profiles there's no Parent/Teacher switch: parents just sign in,
        // and a small link at the bottom opens the teacher sign-in.
        document.querySelector(".hp-tabs").classList.toggle("hidden", profiles);
        $("si-role-link").classList.toggle("hidden", !profiles);
        $("si-role-link").textContent = parent ? "Teacher sign-in" : "← Back to parent sign-in";
        $("si-email").placeholder = "Email";
        (parent && profiles ? $("si-email") : $("si-pass")).focus();
      }
      $("si-role-link").addEventListener("click", () => setRole(role === "parent" ? "teacher" : "parent"));
      document.querySelectorAll(".hp-tab").forEach(t => t.addEventListener("click", () => setRole(t.dataset.role)));
      form.addEventListener("submit", async e => {
        e.preventDefault();
        msg.textContent = "";
        const pw = $("si-pass").value, email = $("si-email").value.trim(), remember = $("si-remember").checked;
        if (!pw) return;
        if (!(window.crypto && crypto.subtle)) { msg.textContent = "Please open this site with https:// at the start of the address."; return; }
        btn.disabled = true; btn.textContent = "Signing in…";
        try {
          if (role === "parent" && email && profiles) {                                   // parent with a profile
            await ParentAccounts.signIn(pa.apiKey, email, pw, remember);
            location.href = "parents.html"; return;
          }
          if (teacherLock && teacherLock.salt) {                     // teacher password?
            let ok = false; try { ok = await teacherPasswordOK(teacherLock, pw); } catch {}
            if (ok) { store("classroom_teacher_unlocked", teacherLock.salt, remember); location.href = "teacher.html"; return; }
          }
          if (lock && lock.hash && !profiles) {                       // class password?
            const h = await hashSitePassword(pw, lock.salt, lock.iterations);
            if (h === lock.hash) { store("classroom_site_unlocked", h, remember); location.href = "parents.html"; return; }
          }
          msg.textContent = role === "parent" && profiles && !email ? "Please type your email too." : "That password isn't right. Please try again.";
          $("si-pass").select();
        } catch (err) {
          msg.textContent = err.message || "That password isn't right. Please try again.";
        } finally { btn.disabled = false; btn.textContent = "Sign in"; }
      });
      // a real photo can replace the drawing: upload "signin-photo.jpg"
      const img = new Image();
      img.onload = () => { const el = $("signin-photo"); el.style.backgroundImage = "url(signin-photo.jpg)"; el.classList.add("show"); };
      img.src = "signin-photo.jpg";
      addPasswordToggles(document);
      setRole("parent");
    })();
  </script>
