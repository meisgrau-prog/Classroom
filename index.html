  <script>
    loadContent().then(c => {
      const n = newNewsCount(c);
      if (n > 0) {
        const count = document.getElementById("news-count");
        count.textContent = n > 9 ? "9+" : String(n);
        count.classList.remove("hidden");
        document.getElementById("news-btn").setAttribute("aria-label", `News (${n} new)`);
      }
    }).catch(() => {});
