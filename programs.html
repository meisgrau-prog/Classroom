<head>

<body data-page="programs">

    <div id="programs"></div>

  <script>
    const list = document.getElementById("programs");
    loadContent().then(c => {
      renderPosts(c.programs, list, {
        empty: "No programs are running right now. Please check back soon.",
        dateLine: item => formatRange(item.start, item.end)
      });
    }).catch(() => showLoadError(list));
