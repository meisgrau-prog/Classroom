<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Rabbi Eisgrau</title>
  <link rel="stylesheet" href="style.css?v=20261222">
  <script src="data.js?v=20261222"></script>
  <script src="common.js?v=20261222"></script>
</head>
<body data-page="contact">
  <header class="topbar">
    <a class="home-btn" href="parents.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
    <span class="brand" data-teacher>Rabbi Eisgrau</span>
  </header>
  <main>
    <h1 class="page-title">Contact Me</h1>
    <hr class="rule">

    <div class="contact-grid">
      <div class="card">
        <h2 class="section-title">Call Me</h2>
        <p class="date" style="margin:0">Tap the button to call.</p>
        <a class="call-big" id="call-btn" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          <span><small>Call</small><span id="call-number"></span></span>
        </a>
        <div class="actions">
          <a class="button secondary" id="text-btn" href="#" style="width:100%;justify-content:center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Send a text</span>
          </a>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Send a Message</h2>
        <p class="date" style="margin:0">Your message will be emailed to me directly.</p>

        <form id="contact-form">
          <label for="name">Your name</label>
          <input id="name" name="name" required autocomplete="name">

          <label for="email">Your email</label>
          <input id="email" name="email" type="email" required autocomplete="email">

          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>

          <!-- Spam trap: real people leave this empty -->
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

          <div class="actions">
            <button class="button" type="submit" id="send">Send message</button>
          </div>
          <p class="status" id="status" role="status"></p>
        </form>
      </div>
    </div>
  </main>
  <script>
    // Phone links
    function fillPhone() {
      const digits = SITE.phone.replace(/[^0-9+]/g, "");
      document.getElementById("call-number").textContent = SITE.phone;
      document.getElementById("call-btn").href = "tel:" + digits;
      document.getElementById("text-btn").href = "sms:" + digits;
    }
    fillPhone();
    loadContent().then(fillPhone).catch(() => {});

    // Messages are delivered by FormSubmit (formsubmit.co), a free service
    // that emails form submissions to SITE.contactEmail.
    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      send.disabled = true;
      send.textContent = "Sending…";
      status.className = "status";
      status.textContent = "";

      const data = Object.fromEntries(new FormData(form));
      data._subject = "New message from your class website";
      data._template = "table";
      data._replyto = data.email;

      try {
        const res = await fetch("https://formsubmit.co/ajax/" + (SITE.formEmail || SITE.contactEmail), {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(data)
        });
        let result = {};
        try { result = await res.json(); } catch {}
        const reason = String(result.message || "");
        if (!res.ok || result.success === false || result.success === "false") {
          throw new Error(reason || "Error " + res.status);
        }
        form.reset();
        status.className = "status ok";
        status.textContent = "Thank you — your message was sent.";
      } catch (err) {
        status.className = "status err";
        status.innerHTML = "";
        status.append("Sorry, the message could not be sent. Please email ");
        const a = document.createElement("a");
        a.href = "mailto:" + SITE.contactEmail;
        a.textContent = SITE.contactEmail;
        status.append(a, " or call " + SITE.phone + ".");
        const why = document.createElement("small");
        why.style.cssText = "display:block;margin-top:6px;font-weight:400;opacity:.75";
        why.textContent = "(Reason: " + (err && err.message ? err.message : "network error") + ")";
        status.appendChild(why);
      } finally {
        send.disabled = false;
        send.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
