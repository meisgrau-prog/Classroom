<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me – My Classroom</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="common.js"></script>
</head>
<body style="--accent: var(--contact)">
  <header>
    <a class="home" href="index.html">← Back to home</a>
    <h1 data-class-name>My Classroom</h1>
  </header>
  <main>
    <div class="card">
      <h2 class="page-title">✉️ Contact Me</h2>
      <p class="date">Send me a message and I'll get back to you by email.</p>

      <form id="contact-form">
        <label for="name">Your name</label>
        <input id="name" name="name" required autocomplete="name">

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <!-- Spam trap: real people leave this empty -->
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

        <div class="actions">
          <button class="button" type="submit" id="send">Send message</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>
    </div>
  </main>
  <script>
    // Messages are delivered by FormSubmit (formsubmit.co), a free service
    // that emails form submissions to SITE.contactEmail.
    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      send.disabled = true;
      send.textContent = "Sending…";
      status.className = "status";
      status.textContent = "";

      const data = Object.fromEntries(new FormData(form));
      data._subject = "New message from " + SITE.className + " website";
      data._template = "table";
      data._replyto = data.email;

      try {
        const res = await fetch("https://formsubmit.co/ajax/" + SITE.contactEmail, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (!res.ok || result.success === false || result.success === "false") {
          throw new Error(result.message || "Send failed");
        }
        form.reset();
        status.className = "status ok";
        status.textContent = "✅ Thank you! Your message was sent.";
      } catch (err) {
        status.className = "status err";
        status.innerHTML = "";
        status.append("Sorry, the message could not be sent. You can email me directly at ");
        const a = document.createElement("a");
        a.href = "mailto:" + SITE.contactEmail;
        a.textContent = SITE.contactEmail;
        status.append(a, ".");
      } finally {
        send.disabled = false;
        send.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
