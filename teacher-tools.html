<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teacher Tools – Rabbi Eisgrau</title>
  <link rel="stylesheet" href="style.css?v=20261209">
  <script src="data.js?v=20261209"></script>
  <script src="common.js?v=20261209"></script>
</head>
<body class="portal tshell" data-page="tools">
  <aside class="ts-side">
    <a class="ts-brand" href="teacher.html"><span class="ts-mono" id="ts-mono">RE</span><span><strong data-teacher>Rabbi Eisgrau</strong><small>Teacher Area</small></span></a>
    <nav class="ts-nav" aria-label="Teacher menu"><a class="ts-item" href="teacher.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></a><a class="ts-item" href="portal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8M12 18v3"/></svg><span>Parent Portal Controls</span></a><a class="ts-item" href="classroom.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/><path d="M3 21h18"/></svg><span>Classroom Tools</span></a><a class="ts-item active" href="teacher-tools.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span>Teacher Tools</span></a><a class="ts-item" href="parents.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>View Parent Portal</span></a></nav>
    <button type="button" class="ts-item ts-out" id="ts-signout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></button>
  </aside>
  <div class="ts-main">
    <nav class="tt-switch" aria-label="Teacher tools">
      <button type="button" data-tool="phonelog" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Phone Log</button>
      <button type="button" data-tool="gradebook" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Gradebook</button>
    </nav>
    <section id="phonelog"></section>
    <section id="gradebook" class="hidden"></section>
  </div>
  <script src="phonelog.js?v=20261209"></script>
  <script src="gradebook.js?v=20261209"></script>
  <script>
    PhoneLog.open(document.getElementById("phonelog"));
    let gbOpen = false;
    function tool(name) {
      document.querySelectorAll(".tt-switch button").forEach(b => b.setAttribute("aria-selected", b.dataset.tool === name ? "true" : "false"));
      document.getElementById("phonelog").classList.toggle("hidden", name !== "phonelog");
      document.getElementById("gradebook").classList.toggle("hidden", name !== "gradebook");
      if (name === "gradebook" && !gbOpen) { Gradebook.open(document.getElementById("gradebook")); gbOpen = true; }
      try { localStorage.setItem("teacher_tools_last", name); } catch {}
    }
    document.querySelectorAll(".tt-switch button").forEach(b => b.addEventListener("click", () => tool(b.dataset.tool)));
    const tab = location.hash.slice(1);
    if (tab === "gradebook") tool("gradebook");
    else if (["follow", "history", "students", "log", "settings"].includes(tab)) document.querySelector(`.pl-tabs [data-tab="${tab}"]`).click();
    else { let last = "phonelog"; try { last = localStorage.getItem("teacher_tools_last") || last; } catch {} tool(last); }
  </script>
  <script>
    document.getElementById("ts-signout").addEventListener("click", () => {
      try { [localStorage, sessionStorage].forEach(s => { s.removeItem("classroom_teacher_unlocked"); s.removeItem("classroom_site_unlocked"); }); } catch {}
      location.href = "index.html";
    });
    (function () { const n = (document.querySelector(".ts-brand strong").textContent || "").split(/\s+/).filter(Boolean); document.getElementById("ts-mono").textContent = n.slice(-2).map(w => w[0]).join("").toUpperCase(); })();
  </script>
</body>
</html>
