  <script>
    PhoneLog.open(document.getElementById("phonelog"));
    let gbOpen = false;
    const TOOLS = ["phonelog", "gradebook", "info", "support", "pdfjoin", "timer"];
    let tmOpen = false;
    let pjOpen = false;
    // gold highlight that slides to the chosen tool
    function moveGlider(animate) {
      const sw = document.querySelector(".tt-switch"), on = sw.querySelector('button[aria-selected="true"]'), g = sw.querySelector(".tt-glider");
      if (!on || !g) return;
      if (!animate) g.style.transition = "none";
      g.style.width = on.offsetWidth + "px"; g.style.height = on.offsetHeight + "px";
      g.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
      if (!animate) { g.offsetWidth; g.style.transition = ""; }
      on.scrollIntoView({ block: "nearest", inline: "center", behavior: animate ? "smooth" : "auto" });
    }
    function tool(name, animate) {
      document.querySelectorAll(".tt-switch button").forEach(b => b.setAttribute("aria-selected", b.dataset.tool === name ? "true" : "false"));
      TOOLS.forEach(t => {
        const el = document.getElementById(t), show = t === name;
        el.classList.toggle("hidden", !show);
        if (show) { el.classList.remove("tt-enter"); el.offsetWidth; el.classList.add("tt-enter"); }
      });
      if (name === "info") StudentInfo.open(document.getElementById("info"));
      if (name === "support") StudentSupport.open(document.getElementById("support"));
      if (name === "timer" && !tmOpen) { TeacherTimer.open(document.getElementById("timer")); tmOpen = true; }
      if (name === "pdfjoin" && !pjOpen) { PdfJoiner.open(document.getElementById("pdfjoin")); pjOpen = true; }
      if (name === "gradebook" && !gbOpen) { Gradebook.open(document.getElementById("gradebook")); gbOpen = true; }
      try { localStorage.setItem("teacher_tools_last", name); } catch {}
      moveGlider(animate);
      const lb = document.querySelector(`.tt-switch [data-tool="${name}"]`);
      if (lb && TeacherSections.styleOf("tools") === "bar") TeacherSections.setTrail("Teacher Tools", lb.textContent.trim());
    }
    window.addEventListener("resize", () => moveGlider(false));
    document.querySelectorAll(".tt-switch button").forEach(b => b.addEventListener("click", () => { if (b.getAttribute("aria-selected") !== "true") tool(b.dataset.tool, true); }));
    const tab = location.hash.slice(1);
    const SUB = ["follow", "history", "students", "log", "settings"];
    const DESC = { phonelog: "Log calls, emails and follow-ups with families", gradebook: "Enter grades, see the dashboard, download Excel", info: "Birthdays, parents, phone numbers and more", support: "What you did to help each student — and if it worked", pdfjoin: "Join PDFs, or split and rearrange pages", timer: "Countdown timer, stopwatch with laps, and work/break intervals" };
    TeacherSections.init({
      id: "tools", title: "Teacher Tools",
      items: [...document.querySelectorAll(".tt-switch button")].map(b => ({ key: b.dataset.tool, label: b.textContent.trim(), icon: b.querySelector("svg").outerHTML, desc: DESC[b.dataset.tool] })),
      bar: () => [document.querySelector(".tt-switch")],
      content: () => TOOLS.map(id => document.getElementById(id)),
      place: el => document.querySelector(".tt-switch").after(el),
      open: k => tool(k),
      initial: TOOLS.includes(tab) ? tab : SUB.includes(tab) ? "phonelog" : null,
      onBar: () => {
        if (TOOLS.includes(tab) && tab !== "phonelog") tool(tab);
        else if (SUB.includes(tab)) tool("phonelog");
        else { let last = "phonelog"; try { last = localStorage.getItem("teacher_tools_last") || last; } catch {} tool(TOOLS.includes(last) ? last : "phonelog"); }
      }
    });
    if (SUB.includes(tab)) document.querySelector(`.pl-tabs [data-tab="${tab}"]`).click();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveGlider(false));
  </script>
  <script>
    document.getElementById("ts-signout").addEventListener("click", () => {
      teacherSignOut();
      location.href = "index.html";
    });
    (function () { const n = (document.querySelector(".ts-brand strong").textContent || "").split(/\s+/).filter(Boolean); document.getElementById("ts-mono").textContent = n.slice(-2).map(w => w[0]).join("").toUpperCase(); })();
