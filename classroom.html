  <div class="ts-main">
    <section id="classroom"></section>
    <p class="tools-note">Your student lists, raffle tickets and prizes are saved only in this browser on this device.</p>
  </div>
  <script src="timer.js?v=20261249"></script>
  <script src="classroom.js?v=20261249"></script>
  <script>
    const crEl = document.getElementById("classroom");
    Classroom.open(crEl);
    const CR_DESC = { students: "Your class list and who's absent today", groups: "Make random groups in one click", number: "Pick a random number", picker: "Pick a random student", raffle: "Tickets, a drawing and a winner", prizes: "Mystery prize boxes", timer: "Countdown, stopwatch and work/break intervals" };
    const crItems = [...crEl.querySelectorAll(".cr-tool")].map(b => ({ key: b.dataset.tool, label: b.textContent.trim(), icon: b.querySelector(".cr-tool-icon").innerHTML, desc: CR_DESC[b.dataset.tool] }));
    TeacherSections.init({
      id: "classroom", title: "Classroom Tools", items: crItems, hashPrefix: "",
      bar: () => [crEl.querySelector(".cr-menu")],
      content: () => [...crEl.querySelectorAll(".cr-view")],
      place: el => crEl.querySelector(".cr-menu").after(el),
      open: k => Classroom.show(k),
      initial: location.hash.slice(1) || null,
      onBar: () => {
        const cur = crEl.querySelector('.cr-tool[aria-current="true"]');
        if (cur) TeacherSections.setTrail("Classroom Tools", cur.textContent.trim());
        crEl.querySelectorAll(".cr-tool").forEach(b => b.addEventListener("click", () => TeacherSections.setTrail("Classroom Tools", b.textContent.trim())));
      }
    });
  </script>
  <script>
    document.getElementById("ts-signout").addEventListener("click", () => {
      teacherSignOut();
      location.href = "index.html";
    });
    (function () { const n = (document.querySelector(".ts-brand strong").textContent || "").split(/\s+/).filter(Boolean); document.getElementById("ts-mono").textContent = n.slice(-2).map(w => w[0]).join("").toUpperCase(); })();
  </script>
