<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News – Rabbi Eisgrau</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="common.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" data-teacher>Rabbi Eisgrau</a>
    <a class="back" href="menu.html">← All sections</a>
  </header>
  <main>
    <h1 class="page-title">News</h1>
    <hr class="rule">
    <div id="news"></div>
  </main>
  <script>
    const list = document.getElementById("news");
    if (!SITE.news || SITE.news.length === 0) {
      list.innerHTML = '<div class="card empty">No news yet. Please check back soon.</div>';
    } else {
      SITE.news.forEach(item => {
        const card = document.createElement("article");
        card.className = "card news-item";
        const h = document.createElement("h2");
        h.textContent = item.title;
        const d = document.createElement("p");
        d.className = "date";
        d.textContent = item.date || "";
        const p = document.createElement("p");
        p.textContent = item.text;
        card.append(h, d, p);
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
