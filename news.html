<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News – Rabbi Eisgrau</title>
  <link rel="stylesheet" href="style.css?v=20261209">
  <script src="data.js?v=20261209"></script>
  <script src="common.js?v=20261209"></script>
</head>
<body data-page="news">
  <header class="topbar">
    <a class="home-btn" href="parents.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
    <span class="brand" data-teacher>Rabbi Eisgrau</span>
  </header>
  <main>
    <h1 class="page-title">News</h1>
    <hr class="rule">
    <div id="news"></div>
  </main>
  <script>
    const list = document.getElementById("news");
    loadContent().then(c => {
      renderPosts(c.news, list, {
        empty: "No news yet. Please check back soon.",
        isNew: item => isNewNews(item, c.settings.newsNewDays)
      });
    }).catch(() => showLoadError(list));
  </script>
</body>
</html>
