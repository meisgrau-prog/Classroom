    const d = new Date(), hr = d.getHours();
    document.getElementById("ts-date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

    TeacherHome.render(document.getElementById("th-home"));
  </script>
